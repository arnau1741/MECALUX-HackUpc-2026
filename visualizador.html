<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mecalux Warehouse Visualizer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; background: #0c0e14; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }

        #panel {
            position: absolute; top: 0; left: 0; width: 270px; height: 100vh;
            background: rgba(11, 13, 20, 0.97);
            border-right: 1px solid #1e2a3a;
            display: flex; flex-direction: column;
            z-index: 10;
        }
        #panel-header {
            padding: 14px 16px;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            border-bottom: 1px solid #1e2a3a;
            flex-shrink: 0;
        }
        #panel-header h1 { font-size: 13px; font-weight: 700; color: #e879f9; letter-spacing: 1.5px; text-transform: uppercase; }
        #panel-header p { font-size: 10px; color: #475569; margin-top: 3px; }

        #status-bar {
            padding: 7px 16px; font-size: 11px;
            background: #0d1117; border-bottom: 1px solid #1e2a3a;
            display: flex; align-items: center; gap: 7px;
            flex-shrink: 0;
        }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .status-dot.ok      { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
        .status-dot.loading { background: #f59e0b; animation: blink 1s infinite; }
        .status-dot.error   { background: #ef4444; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
        #status-text { color: #94a3b8; }

        #panel-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 18px; }
        #panel-body::-webkit-scrollbar { width: 3px; }
        #panel-body::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 2px; }

        .section-title {
            font-size: 9px; font-weight: 700; color: #475569;
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;
        }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
        .stat-card {
            background: #0f172a; border: 1px solid #1e2a3a;
            border-radius: 7px; padding: 10px; text-align: center;
        }
        .stat-card .val { font-size: 22px; font-weight: 800; color: #e879f9; line-height: 1; }
        .stat-card .lbl { font-size: 9px; color: #475569; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        #bay-legend { display: flex; flex-direction: column; gap: 5px; }
        .bay-item { display: flex; align-items: center; gap: 9px; padding: 7px 9px; background: #0f172a; border-radius: 5px; font-size: 11px; border: 1px solid #1e2a3a; }
        .bay-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
        .bay-name { flex: 1; color: #cbd5e1; font-size: 10px; }
        .bay-dim  { color: #475569; font-size: 9px; }
        .bay-cnt  { color: #94a3b8; font-weight: 700; font-size: 12px; }

        .btn-row { display: flex; gap: 6px; }
        .btn {
            flex: 1; padding: 8px 4px; font-size: 11px; font-weight: 600;
            border: 1px solid #1e2a3a; background: #0f172a;
            color: #94a3b8; border-radius: 6px; cursor: pointer;
            transition: all 0.15s; letter-spacing: 0.3px;
        }
        .btn:hover { background: #1e2a3a; color: #e2e8f0; }
        .btn.primary { background: #6d28d9; border-color: #7c3aed; color: #f0e8ff; }
        .btn.primary:hover { background: #7c3aed; }

        .toggle-list { display: flex; flex-direction: column; }
        .tog-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 7px 0; border-bottom: 1px solid #0f172a;
            font-size: 11px; color: #64748b;
        }
        .tog-row:last-child { border-bottom: none; }
        .sw { position: relative; width: 32px; height: 18px; flex-shrink: 0; }
        .sw input { opacity: 0; width: 0; height: 0; }
        .sw-track {
            position: absolute; inset: 0; background: #1e2a3a;
            border-radius: 18px; cursor: pointer; transition: 0.2s;
        }
        .sw-track:before {
            content: ''; position: absolute;
            width: 14px; height: 14px; left: 2px; top: 2px;
            background: #475569; border-radius: 50%; transition: 0.2s;
        }
        .sw input:checked + .sw-track { background: #4c1d95; }
        .sw input:checked + .sw-track:before { background: #e879f9; transform: translateX(14px); }

        #tooltip {
            position: fixed; pointer-events: none; z-index: 1000;
            background: rgba(7, 9, 16, 0.97);
            border: 1px solid #2d3748; border-radius: 8px;
            padding: 11px 14px; font-size: 11px; line-height: 1.9;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            display: none; min-width: 170px;
        }
        #tooltip .tt-title { font-weight: 700; color: #e879f9; font-size: 12px; margin-bottom: 3px; }
        #tooltip .tt-row { color: #475569; }
        #tooltip .tt-row span { color: #cbd5e1; }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>

<div id="panel">
    <div id="panel-header">
        <h1>Mecalux Warehouse</h1>
        <p>3D Layout Visualizer</p>
    </div>
    <div id="status-bar">
        <span class="status-dot loading" id="sdot"></span>
        <span id="stxt">Cargando datos…</span>
    </div>
    <div id="panel-body">

        <div>
            <div class="section-title">Resumen</div>
            <div class="stat-grid">
                <div class="stat-card"><div class="val" id="s-total">–</div><div class="lbl">Total Bays</div></div>
                <div class="stat-card"><div class="val" id="s-types">–</div><div class="lbl">Tipos</div></div>
            </div>
        </div>

        <div>
            <div class="section-title">Leyenda de Bays</div>
            <div id="bay-legend"></div>
        </div>

        <div>
            <div class="section-title">Cámara</div>
            <div class="btn-row">
                <button class="btn" id="btn-fit">Encuadrar</button>
                <button class="btn" id="btn-top">Top</button>
                <button class="btn" id="btn-3d">3D</button>
            </div>
        </div>

        <div>
            <div class="section-title">Capas</div>
            <div class="toggle-list">
                <div class="tog-row"><span>Suelo</span>       <label class="sw"><input type="checkbox" id="t-floor"   checked><span class="sw-track"></span></label></div>
                <div class="tog-row"><span>Paredes</span>     <label class="sw"><input type="checkbox" id="t-walls"   checked><span class="sw-track"></span></label></div>
                <div class="tog-row"><span>Techo</span>       <label class="sw"><input type="checkbox" id="t-ceil"           ><span class="sw-track"></span></label></div>
                <div class="tog-row"><span>Obstáculos</span>  <label class="sw"><input type="checkbox" id="t-obs"    checked><span class="sw-track"></span></label></div>
                <div class="tog-row"><span>Grid</span>        <label class="sw"><input type="checkbox" id="t-grid"   checked><span class="sw-track"></span></label></div>
            </div>
        </div>

        <div>
            <button class="btn primary" id="btn-reload" style="width:100%;padding:10px;">↺ Recargar archivos</button>
        </div>

    </div>
</div>

<div id="tooltip">
    <div class="tt-title" id="tt-title"></div>
    <div class="tt-row">Pos: <span id="tt-pos"></span></div>
    <div class="tt-row">Dim: <span id="tt-dim"></span></div>
    <div class="tt-row">Rot: <span id="tt-rot"></span></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Renderer ──────────────────────────────────────────────────────────────────
const PANEL_W = 270;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c12);
scene.fog = new THREE.FogExp2(0x0a0c12, 0.000018);

const camera = new THREE.PerspectiveCamera(55, (window.innerWidth - PANEL_W) / window.innerHeight, 10, 300000);
camera.position.set(7000, 10000, 16000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth - PANEL_W, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.style.cssText = `position:absolute;left:${PANEL_W}px;top:0`;
document.body.appendChild(renderer.domElement);

// ── Controls ──────────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 500;
controls.maxDistance = 80000;

// ── Lighting ──────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
scene.add(new THREE.HemisphereLight(0x3a5f8a, 0x120a04, 0.4));

const sun = new THREE.DirectionalLight(0xfff0e0, 1.4);
sun.position.set(10000, 25000, 8000);
sun.castShadow = true;
Object.assign(sun.shadow.mapSize, { width: 4096, height: 4096 });
Object.assign(sun.shadow.camera, { near: 100, far: 70000, left: -18000, right: 18000, top: 18000, bottom: -18000 });
scene.add(sun);

// ── Layer groups ──────────────────────────────────────────────────────────────
const L = {};
['floor','walls','ceiling','obs','bays','grid'].forEach(k => { L[k] = new THREE.Group(); scene.add(L[k]); });
L.ceiling.visible = false;

// ── Colours ───────────────────────────────────────────────────────────────────
const BAY_HEX = [0x60a5fa, 0xf87171, 0x4ade80, 0xfbbf24, 0xc084fc, 0x22d3ee, 0xfb923c];
const TYPE_LABEL = {0:'S-tall',1:'M-tall',2:'L-tall',3:'S-low',4:'M-low',5:'L-low'};

let bayMeshes = [];
let bayTypes  = {};
let whBox     = new THREE.Box3();

// ── Helpers ───────────────────────────────────────────────────────────────────
const parseCSV = txt => txt.trim().split('\n')
    .map(l => l.split(',').map(v => parseFloat(v.trim())))
    .filter(r => r.length >= 2 && !isNaN(r[0]));

function setStatus(state, txt) {
    document.getElementById('sdot').className = 'status-dot ' + state;
    document.getElementById('stxt').textContent = txt;
}

// ── Build scene ───────────────────────────────────────────────────────────────
function buildScene(whTxt, ceilTxt, obsTxt, baysTxt, outTxt) {
    Object.values(L).forEach(g => { while(g.children.length) g.remove(g.children[0]); });
    bayMeshes = [];

    const whPts   = parseCSV(whTxt);
    const ceilPts = parseCSV(ceilTxt).sort((a,b) => a[0]-b[0]);
    const obsPts  = parseCSV(obsTxt);
    const bayRows = parseCSV(baysTxt);
    const outRows = parseCSV(outTxt);

    bayTypes = {};
    bayRows.forEach(r => { if(r.length >= 4) bayTypes[r[0]] = {w:r[1], d:r[2], h:r[3]}; });

    if(!whPts.length) { setStatus('error','warehouse.csv vacío'); return; }

    // bounding box of warehouse
    const minX = Math.min(...whPts.map(p=>p[0]));
    const maxX = Math.max(...whPts.map(p=>p[0]));
    const minZ = Math.min(...whPts.map(p=>p[1]));
    const maxZ = Math.max(...whPts.map(p=>p[1]));
    const maxH = ceilPts.reduce((m,p) => Math.max(m, p[1]), 3000);

    whBox.set(new THREE.Vector3(minX,0,minZ), new THREE.Vector3(maxX, maxH, maxZ));

    // ── FLOOR (polygon shape) ────────────────────────────────────────────────
    const shape = new THREE.Shape();
    shape.moveTo(whPts[0][0], whPts[0][1]);
    for(let i=1;i<whPts.length;i++) shape.lineTo(whPts[i][0], whPts[i][1]);
    shape.closePath();

    const floorMesh = new THREE.Mesh(
        new THREE.ShapeGeometry(shape),
        new THREE.MeshStandardMaterial({ color:0x141c2e, roughness:0.95, metalness:0.05 })
    );
    floorMesh.rotation.x = -Math.PI/2;
    floorMesh.receiveShadow = true;
    L.floor.add(floorMesh);

    // ── GRID ─────────────────────────────────────────────────────────────────
    const gridMat = new THREE.LineBasicMaterial({ color:0x1e2e44, transparent:true, opacity:0.5 });
    const step = 1000;
    for(let x=Math.ceil(minX/step)*step; x<=maxX; x+=step) {
        const pts = [new THREE.Vector3(x,1,minZ), new THREE.Vector3(x,1,maxZ)];
        L.grid.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
    }
    for(let z=Math.ceil(minZ/step)*step; z<=maxZ; z+=step) {
        const pts = [new THREE.Vector3(minX,1,z), new THREE.Vector3(maxX,1,z)];
        L.grid.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
    }

    // ── WALLS ────────────────────────────────────────────────────────────────
    const wallMat = new THREE.MeshStandardMaterial({ color:0x1e3a5a, transparent:true, opacity:0.3, side:THREE.DoubleSide, roughness:0.8 });
    const wallEdge = new THREE.LineBasicMaterial({ color:0x3b82f6, transparent:true, opacity:0.6 });
    const perimMat = new THREE.LineBasicMaterial({ color:0xe879f9 });

    const closed = [...whPts, whPts[0]];
    for(let i=0;i<closed.length-1;i++) {
        const [ax,az] = closed[i];
        const [bx,bz] = closed[i+1];
        const len = Math.hypot(bx-ax, bz-az);
        const wm = new THREE.Mesh(new THREE.PlaneGeometry(len, maxH), wallMat);
        wm.position.set((ax+bx)/2, maxH/2, (az+bz)/2);
        wm.rotation.y = -Math.atan2(bz-az, bx-ax);
        L.walls.add(wm);
        // top cap line
        L.walls.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(ax,maxH,az), new THREE.Vector3(bx,maxH,bz)]),
            wallEdge));
    }
    // base perimeter highlight
    L.walls.add(new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(whPts.map(p => new THREE.Vector3(p[0], 2, p[1]))),
        perimMat));

    // ── CEILING zones ─────────────────────────────────────────────────────────
    const ceilMat = new THREE.MeshStandardMaterial({ color:0x7dd3fc, transparent:true, opacity:0.06, side:THREE.DoubleSide });
    const ceilLine = new THREE.LineBasicMaterial({ color:0x7dd3fc, transparent:true, opacity:0.4 });
    ceilPts.forEach((cp,i) => {
        const sx = cp[0];
        const ex = i < ceilPts.length-1 ? ceilPts[i+1][0] : maxX;
        const w = ex - sx, depth = maxZ - minZ;
        const cm = new THREE.Mesh(new THREE.BoxGeometry(w, 30, depth), ceilMat);
        cm.position.set(sx+w/2, cp[1], (minZ+maxZ)/2);
        L.ceiling.add(cm);
        L.ceiling.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(sx,cp[1],minZ), new THREE.Vector3(ex,cp[1],minZ)]),
            ceilLine));
        L.ceiling.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(sx,cp[1],maxZ), new THREE.Vector3(ex,cp[1],maxZ)]),
            ceilLine));
    });

    // ── OBSTACLES ─────────────────────────────────────────────────────────────
    const obsMat  = new THREE.MeshStandardMaterial({ color:0xef4444, transparent:true, opacity:0.5, roughness:0.7 });
    const obsEdge = new THREE.LineBasicMaterial({ color:0xff6b6b, transparent:true, opacity:0.8 });
    obsPts.forEach(p => {
        if(p.length < 4) return;
        const [x,z,w,d] = p;
        const h = maxH;
        const g = new THREE.BoxGeometry(w, h, d);
        const m = new THREE.Mesh(g, obsMat);
        m.position.set(x+w/2, h/2, z+d/2);
        m.castShadow = true;
        m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), obsEdge));
        L.obs.add(m);
    });

    // ── BAYS ──────────────────────────────────────────────────────────────────
    const byType = {};
    outRows.forEach(p => {
        if(p.length < 4) return;
        const [id,x,z,rot] = p;
        if(!bayTypes[id]) return;
        const b = bayTypes[id];
        const sw = (rot % 180 !== 0);
        const pw = sw ? b.d : b.w;
        const pd = sw ? b.w : b.d;

        byType[id] = (byType[id]||0) + 1;

        const col = BAY_HEX[id % BAY_HEX.length];
        const geo = new THREE.BoxGeometry(pw, b.h, pd);
        const mat = new THREE.MeshStandardMaterial({ color:col, roughness:0.55, metalness:0.12 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x+pw/2, b.h/2, z+pd/2);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.add(new THREE.LineSegments(
            new THREE.EdgesGeometry(geo),
            new THREE.LineBasicMaterial({ color:0x000000, transparent:true, opacity:0.35 })
        ));
        mesh.userData = { id, x, z, rot, pw, pd, h:b.h };
        bayMeshes.push(mesh);
        L.bays.add(mesh);
    });

    // ── UI update ─────────────────────────────────────────────────────────────
    const total = Object.values(byType).reduce((s,v)=>s+v, 0);
    document.getElementById('s-total').textContent = total;
    document.getElementById('s-types').textContent = Object.keys(byType).length;

    const leg = document.getElementById('bay-legend');
    leg.innerHTML = '';
    Object.entries(byType).sort((a,b)=>+a[0]-+b[0]).forEach(([id,cnt]) => {
        const hex = '#' + BAY_HEX[id % BAY_HEX.length].toString(16).padStart(6,'0');
        const b = bayTypes[id];
        const dim = b ? `${b.w/100}×${b.d/100}×${b.h/100} m` : '';
        leg.innerHTML += `<div class="bay-item">
            <div class="bay-swatch" style="background:${hex}"></div>
            <div style="flex:1">
                <div class="bay-name">Type ${id} – ${TYPE_LABEL[id]||''}</div>
                <div class="bay-dim">${dim}</div>
            </div>
            <div class="bay-cnt">×${cnt}</div>
        </div>`;
    });

    setStatus('ok', `${total} bays renderizados`);
}

// ── Load & render ─────────────────────────────────────────────────────────────
async function loadAndRender() {
    setStatus('loading', 'Cargando archivos…');
    try {
        const [wh, ceil, obs, bays, out] = await Promise.all([
            fetch('warehouse.csv').then(r=>r.text()),
            fetch('ceiling.csv').then(r=>r.text()),
            fetch('obstacles.csv').then(r=>r.text()),
            fetch('types_of_bays.csv').then(r=>r.text()),
            fetch('output.txt').then(r=>r.text()),
        ]);
        buildScene(wh, ceil, obs, bays, out);
        fitCamera();
    } catch(e) {
        setStatus('error', e.message);
    }
}

// ── Camera ────────────────────────────────────────────────────────────────────
function fitCamera() {
    const c = new THREE.Vector3(), s = new THREE.Vector3();
    whBox.getCenter(c); whBox.getSize(s);
    const d = Math.max(s.x, s.z) * 1.35;
    camera.position.set(c.x - d*0.4, d*0.75, c.z + d*0.9);
    controls.target.set(c.x, 0, c.z);
    controls.update();
}
function topCamera() {
    const c = new THREE.Vector3(), s = new THREE.Vector3();
    whBox.getCenter(c); whBox.getSize(s);
    camera.position.set(c.x, Math.max(s.x,s.z)*1.3, c.z+0.01);
    controls.target.set(c.x, 0, c.z);
    controls.update();
}

// ── Toggles ───────────────────────────────────────────────────────────────────
[['t-floor','floor'],['t-walls','walls'],['t-ceil','ceiling'],['t-obs','obs'],['t-grid','grid']].forEach(([id,k]) => {
    document.getElementById(id).addEventListener('change', e => { L[k].visible = e.target.checked; });
});

// ── Buttons ───────────────────────────────────────────────────────────────────
document.getElementById('btn-fit').addEventListener('click', fitCamera);
document.getElementById('btn-top').addEventListener('click', topCamera);
document.getElementById('btn-3d').addEventListener('click', fitCamera);
document.getElementById('btn-reload').addEventListener('click', loadAndRender);

// ── Tooltip / Raycaster ───────────────────────────────────────────────────────
const rc = new THREE.Raycaster();
const mp = new THREE.Vector2();
const tt = document.getElementById('tooltip');

renderer.domElement.addEventListener('mousemove', e => {
    const r = renderer.domElement.getBoundingClientRect();
    mp.x =  ((e.clientX - r.left) / r.width)  * 2 - 1;
    mp.y = -((e.clientY - r.top)  / r.height) * 2 + 1;
    rc.setFromCamera(mp, camera);
    const hits = rc.intersectObjects(bayMeshes);
    if(hits.length) {
        const u = hits[0].object.userData;
        document.getElementById('tt-title').textContent = `Bay Type ${u.id} — ${TYPE_LABEL[u.id]||''}`;
        document.getElementById('tt-pos').textContent  = `(${u.x}, ${u.z})`;
        document.getElementById('tt-dim').textContent  = `${u.pw/100} × ${u.pd/100} × ${u.h/100} m`;
        document.getElementById('tt-rot').textContent  = `${u.rot}°`;
        tt.style.display = 'block';
        tt.style.left    = (e.clientX + 16) + 'px';
        tt.style.top     = (e.clientY - 14) + 'px';
    } else {
        tt.style.display = 'none';
    }
});
renderer.domElement.addEventListener('mouseleave', () => { tt.style.display = 'none'; });

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
    const w = window.innerWidth - PANEL_W, h = window.innerHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

// ── Loop ──────────────────────────────────────────────────────────────────────
(function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();

loadAndRender();
</script>
</body>
</html>
